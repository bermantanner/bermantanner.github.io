<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Tints the mobile browser chrome to match the page. -->
  <meta name="theme-color" content="#d3e6ef" />
  <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
  <!-- Safari doesn't render SVG favicons; PNG fallback plus the iOS home-screen icon. -->
  <link rel="icon" href="%sveltekit.assets%/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
  %sveltekit.head%
</head>
<body>
  %sveltekit.body%
</body>
</html>
